<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3B7DD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="背单词">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📖</text></svg>">
<title>Vocabulary — 英语背单词</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --primary: #3B7DD8;
  --primary-dark: #2E6BC0;
  --primary-light: #EEF4FC;
  --primary-soft: #F5F8FD;
  --success: #27AE60;
  --success-light: #EDF9F2;
  --danger: #E74C3C;
  --danger-light: #FEF3F1;
  --warning: #F59E0B;
  --warning-light: #FFFCF0;
  --bg: #FFFFFF;
  --bg-subtle: #F9FAFB;
  --text: #1A1D26;
  --text-secondary: #8B919E;
  --text-tertiary: #B0B8C5;
  --border: #E8ECF1;
  --border-light: #F2F4F7;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
  --radius-xs: 10px;
  --radius-sm: 14px;
  --radius: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --tab-height: 72px;
  --header-height: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font);
  font-size: 17px;
  color: var(--text);
  background: var(--bg-subtle);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

button, input, textarea {
  font-family: inherit;
  font-size: inherit;
  border: none;
  outline: none;
  background: none;
}
button { cursor: pointer; user-select: none; -webkit-user-select: none; }
input, textarea { width: 100%; }

/* ===== Auth Screen ===== */
#auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 24px;
  background: linear-gradient(160deg, #F0F5FB 0%, #E8EFF8 30%, #F5F7FA 60%, #EEF2F7 100%);
}

#auth-screen.hidden { display: none; }

.auth-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg);
  border-radius: 24px;
  padding: 40px 28px 28px;
  box-shadow: 0 20px 60px rgba(59,125,216,0.12), 0 4px 16px rgba(0,0,0,0.04);
  text-align: center;
}

.auth-icon {
  font-size: 56px;
  margin-bottom: 8px;
  display: inline-block;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.auth-title {
  font-size: 28px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.8px;
  margin-bottom: 4px;
}

.auth-desc {
  font-size: 14px;
  color: var(--text-tertiary);
  margin-bottom: 28px;
  font-weight: 500;
}

.auth-tabs {
  display: flex;
  width: 100%;
  background: var(--bg-subtle);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 24px;
}

.auth-tab {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  color: var(--text-secondary);
  transition: all 0.25s;
}
.auth-tab.active {
  background: var(--bg);
  color: var(--primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.auth-form { display: none; }
.auth-form.active { display: block; }

.input-icon-wrap {
  position: relative;
  margin-bottom: 12px;
}

.input-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  z-index: 1;
  pointer-events: none;
}

.input-icon-wrap .auth-input {
  padding-left: 46px;
}

.auth-input {
  width: 100%;
  padding: 15px 18px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  min-height: 52px;
  background: var(--bg-subtle);
  transition: all 0.2s;
}
.auth-input:focus {
  border-color: var(--primary);
  background: var(--bg);
  box-shadow: 0 0 0 4px rgba(59,125,216,0.08);
}

.auth-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary), #5B9FE8);
  color: #fff;
  border-radius: 14px;
  font-weight: 700;
  font-size: 17px;
  min-height: 54px;
  transition: all 0.2s;
  letter-spacing: 0.5px;
  box-shadow: 0 6px 20px rgba(59,125,216,0.3);
  margin-top: 4px;
}
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(59,125,216,0.4); }
.auth-btn:active { transform: scale(0.97); }
.auth-btn:disabled { opacity: 0.5; pointer-events: none; }

.auth-error {
  color: var(--danger);
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
  min-height: 18px;
}

.auth-footer {
  font-size: 12px;
  color: var(--text-tertiary);
  text-align: center;
  margin-top: 24px;
  line-height: 1.6;
}

/* ===== App Shell ===== */
#app-screen { display: none; flex-direction: column; height: 100%; }
#app-screen.active { display: flex; }

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 840px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  box-shadow: var(--shadow-md);
  width: 100%;
}

@media (min-width: 840px) {
  #app {
    border-left: 1px solid var(--border-light);
    border-right: 1px solid var(--border-light);
  }
}

/* ===== Header ===== */
#header {
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-light);
  z-index: 100;
  flex-shrink: 0;
}

#header .logo { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
#header .streak-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
  font-weight: 700;
  color: #D97706;
  background: var(--warning-light);
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid #FDE68A;
}

#header .header-right { display: flex; align-items: center; gap: 4px; }
#header .btn-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 18px;
  transition: background 0.2s;
  color: var(--text-secondary);
}
#header .btn-icon:hover { background: var(--bg-subtle); color: var(--text); }

#header .btn-install {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 16px; background: var(--primary); color: #fff;
  border-radius: 20px; font-size: 13px; font-weight: 700;
  cursor: pointer; animation: popIn 0.3s ease; white-space: nowrap;
}
#header .btn-install:hover { background: var(--primary-dark); }

#header .user-email {
  font-size: 12px;
  color: var(--text-tertiary);
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-right: 4px;
}

/* ===== Main Content ===== */
#main-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 20px;
  padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 24px);
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

.panel { display: none; }
.panel.active { display: block; animation: fadeIn 0.2s ease; }

/* ===== Bottom Tab Bar ===== */
#tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 840px;
  height: calc(var(--tab-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-light);
  display: flex;
  z-index: 100;
}

#tab-bar .tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-tertiary);
  transition: all 0.2s;
  font-size: 12px;
  font-weight: 600;
  min-height: 44px;
  position: relative;
}

#tab-bar .tab .tab-icon { font-size: 24px; transition: transform 0.2s; }
#tab-bar .tab.active { color: var(--primary); }
#tab-bar .tab.active .tab-icon { transform: scale(1.1); }
#tab-bar .tab.active::after {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  background: var(--primary);
  border-radius: 0 0 3px 3px;
}

/* ===== Study Panel ===== */
.review-count {
  text-align: center;
  padding: 16px 20px;
  margin-bottom: 20px;
  background: var(--primary-soft);
  border-radius: var(--radius);
  color: var(--primary-dark);
  font-weight: 700;
  font-size: 16px;
  border: 1px solid var(--primary-light);
}

.no-review {
  text-align: center;
  padding: 80px 24px;
  color: var(--text-secondary);
}
.no-review .emoji { font-size: 72px; margin-bottom: 20px; }
.no-review .msg { font-size: 17px; line-height: 1.7; }

/* Quiz Card */
.quiz-card {
  background: var(--bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 28px 24px;
  transition: all 0.3s;
  border: 1px solid var(--border-light);
}

.quiz-card.correct { animation: flashGreen 0.5s ease; }
.quiz-card.wrong { animation: shake 0.5s ease, flashRed 0.5s ease; }

.quiz-type-label {
  display: inline-block;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 700;
  letter-spacing: 0.6px;
  margin-bottom: 12px;
  background: var(--bg-subtle);
  padding: 4px 12px;
  border-radius: 20px;
}

.quiz-prompt {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 24px;
  color: var(--text);
  line-height: 1.45;
  word-break: break-word;
  letter-spacing: -0.2px;
}

.quiz-prompt .word-display {
  font-size: 34px;
  color: var(--primary);
  letter-spacing: 1px;
  font-weight: 900;
}

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.option-btn {
  padding: 18px 20px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 18px;
  font-weight: 600;
  text-align: center;
  transition: all 0.18s ease;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  word-break: break-word;
  background: var(--bg);
  color: var(--text);
}

.option-btn:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.option-btn:active { transform: scale(0.97); }
.option-btn.selected-correct { border-color: var(--success); background: var(--success-light); color: var(--success); font-weight: 700; }
.option-btn.selected-wrong { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
.option-btn.reveal-correct { border-color: var(--success); background: var(--success-light); color: var(--success); font-weight: 700; }

.quiz-input-row { display: flex; gap: 12px; }
.quiz-input {
  flex: 1;
  padding: 16px 20px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 20px;
  font-weight: 600;
  transition: all 0.2s;
  min-height: 56px;
  background: var(--bg-subtle);
  letter-spacing: 1px;
}
.quiz-input:focus { border-color: var(--primary); background: var(--bg); box-shadow: 0 0 0 4px rgba(59,125,216,0.1); }
.quiz-input.correct { border-color: var(--success); background: var(--success-light); }
.quiz-input.wrong { border-color: var(--danger); background: var(--danger-light); }

.submit-btn {
  padding: 16px 28px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 17px;
  min-height: 56px;
  min-width: 90px;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.submit-btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
.submit-btn:active { transform: scale(0.97); }

.listen-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px 28px;
  background: var(--primary-soft);
  color: var(--primary);
  border-radius: var(--radius);
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 20px;
  width: 100%;
  min-height: 60px;
  transition: all 0.2s;
  border: 2px solid transparent;
}
.listen-btn:hover { background: var(--primary-light); border-color: var(--primary); }
.listen-btn:active { transform: scale(0.97); }
.listen-btn .speaker-icon { font-size: 26px; }

.missing-letters {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: 8px;
  text-align: center;
  padding: 20px;
  color: var(--primary);
  font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
  background: var(--primary-soft);
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
}

.drag-word {
  display: inline-block;
  padding: 14px 32px;
  background: var(--primary);
  color: #fff;
  border-radius: 28px;
  font-size: 20px;
  font-weight: 800;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  margin: 0 auto 20px;
  transition: all 0.2s;
  touch-action: none;
  box-shadow: 0 4px 16px rgba(59,125,216,0.3);
  letter-spacing: 0.5px;
}
.drag-word:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(59,125,216,0.4); }
.drag-word:active { cursor: grabbing; }
.drag-word.dragging { opacity: 0.6; }
.drag-word.selected {
  box-shadow: 0 0 0 5px rgba(59,125,216,0.25);
  animation: bounce 0.4s ease;
}

.drop-zones { display: flex; flex-direction: column; gap: 14px; }
.drop-zone {
  padding: 18px 20px;
  border: 2.5px dashed var(--border);
  border-radius: var(--radius-sm);
  min-height: 52px;
  text-align: center;
  transition: all 0.2s;
  font-size: 17px;
  line-height: 1.6;
  background: var(--bg-subtle);
  color: var(--text);
}
.drop-zone.drag-over { border-color: var(--primary); background: var(--primary-soft); border-style: solid; }
.drop-zone .blank {
  display: inline-block;
  min-width: 70px;
  border-bottom: 3px solid var(--primary);
  margin: 0 6px;
  vertical-align: bottom;
}

.feedback-toast {
  position: fixed;
  top: 84px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 28px;
  border-radius: 28px;
  font-weight: 800;
  font-size: 18px;
  z-index: 200;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 1s forwards;
  pointer-events: none;
  box-shadow: var(--shadow-lg);
  letter-spacing: 0.3px;
}
.feedback-toast.correct { background: var(--success); color: #fff; }
.feedback-toast.wrong { background: var(--danger); color: #fff; }

.answer-reveal {
  margin-top: 20px;
  padding: 16px 20px;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
  font-size: 16px;
  text-align: center;
  color: var(--text-secondary);
  border: 1px solid var(--border-light);
}
.answer-reveal strong { color: var(--primary); font-weight: 700; }

/* ===== Word Bank ===== */
.wordbank-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  background: var(--bg-subtle);
  padding: 5px;
  border-radius: var(--radius-sm);
}
.wordbank-tab {
  flex: 1;
  padding: 12px 20px;
  border-radius: var(--radius-xs);
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  transition: all 0.2s;
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}
.wordbank-tab.active { background: var(--bg); color: var(--primary); box-shadow: var(--shadow-sm); }

.search-add-row { display: flex; gap: 10px; margin-bottom: 16px; }
.search-input {
  flex: 1;
  padding: 12px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: 16px;
  min-height: 48px;
  transition: all 0.2s;
  background: var(--bg-subtle);
}
.search-input:focus { border-color: var(--primary); background: var(--bg); box-shadow: 0 0 0 4px rgba(59,125,216,0.08); }

.add-word-btn {
  padding: 12px 22px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-xs);
  font-weight: 700;
  font-size: 15px;
  min-height: 48px;
  white-space: nowrap;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.add-word-btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }

.word-list { display: flex; flex-direction: column; gap: 10px; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-secondary); font-size: 16px; }

.word-card {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  transition: all 0.2s;
  box-shadow: var(--shadow-sm);
}
.word-card:hover { box-shadow: var(--shadow); }
.word-card:active { transform: scale(0.99); }

.word-card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.word-card-main { flex: 1; min-width: 0; cursor: pointer; }
.word-card-english { font-size: 19px; font-weight: 800; color: var(--text); letter-spacing: -0.2px; }
.phonetic { font-size: 14px; font-weight: 500; color: var(--text-tertiary); margin-left: 6px; font-style: italic; }

/* Dictation */
.dictation-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; margin-bottom: 12px;
  background: var(--primary-soft); border-radius: var(--radius-sm);
  border: 1px solid var(--primary-light);
}
.dictation-count { font-size: 14px; font-weight: 600; color: var(--primary); flex: 1; }
.dictation-btn {
  padding: 8px 14px; border-radius: 20px;
  font-size: 13px; font-weight: 700;
  background: var(--bg); color: var(--text-secondary);
  border: 1px solid var(--border);
}
.dictation-btn.primary { background: var(--primary); color: #fff; border: none; }
.dictation-btn:hover { opacity: 0.85; }

.word-card-check {
  width: 22px; height: 22px; accent-color: var(--primary);
  cursor: pointer; flex-shrink: 0;
}

.dictation-card {
  background: var(--bg); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: 24px; margin-top: 16px;
  border: 1px solid var(--border-light);
}
.dictation-progress { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 12px; }
.dictation-prompt { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 20px; color: var(--text); }
.dictation-input-group { margin-bottom: 14px; }
.dictation-input-group label { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
.dictation-input {
  width: 100%; padding: 14px 16px; border: 2px solid var(--border);
  border-radius: var(--radius-sm); font-size: 17px; font-weight: 500;
  min-height: 48px; background: var(--bg-subtle);
}
.dictation-input:focus { border-color: var(--primary); background: var(--bg); }
.dictation-input.correct { border-color: var(--success); background: var(--success-light); }
.dictation-input.wrong { border-color: var(--danger); background: var(--danger-light); }

.dictation-actions { display: flex; gap: 10px; margin-top: 16px; }
.dictation-actions .btn { flex: 1; }

.dictation-result-card {
  background: var(--bg); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: 24px; margin-top: 16px;
  text-align: center;
}
.dictation-result-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border-light);
  font-size: 15px; text-align: left;
}
.dictation-result-item:last-child { border-bottom: none; }
.dictation-result-icon { font-size: 20px; flex-shrink: 0; }
.dictation-result-word { font-weight: 700; }
.dictation-result-answer { color: var(--text-secondary); font-size: 13px; }
.word-card-chinese { font-size: 15px; color: var(--text-secondary); margin-top: 4px; }
.word-card-actions { display: flex; gap: 4px; flex-shrink: 0; }
.card-action-btn {
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 18px;
  transition: all 0.2s;
  min-height: 42px;
  color: var(--text-secondary);
}
.card-action-btn:hover { background: var(--bg-subtle); color: var(--text); }
.card-action-btn.delete:hover { background: var(--danger-light); color: var(--danger); }

.progress-bar-wrap {
  height: 5px;
  background: var(--border-light);
  border-radius: 3px;
  margin-top: 12px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #63ADF2);
  border-radius: 3px;
  transition: width 0.5s ease;
}
.progress-bar-fill.mastered { background: linear-gradient(90deg, var(--success), #4CD964); }

.word-detail {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border-light);
  display: none;
}
.word-card.expanded .word-detail { display: block; animation: fadeIn 0.25s ease; }
.word-detail-row { margin-bottom: 12px; font-size: 15px; line-height: 1.65; }
.word-detail-label { font-size: 12px; color: var(--text-tertiary); font-weight: 700; letter-spacing: 0.8px; margin-bottom: 4px; }
.detail-listen-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: var(--primary-soft);
  color: var(--primary);
  border-radius: 22px;
  font-weight: 700;
  font-size: 15px;
  margin: 10px 0 4px;
  min-height: 44px;
  transition: all 0.2s;
}
.detail-listen-btn:hover { background: var(--primary-light); }
.example-sentences { margin-top: 12px; }
.example-sentence {
  padding: 12px 16px;
  background: var(--bg-subtle);
  border-radius: var(--radius-xs);
  margin-bottom: 8px;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  border-left: 3px solid var(--primary-light);
}
.example-sentence .highlight { color: var(--primary); font-weight: 800; }

/* ===== Stats ===== */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 22px 18px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-card-value { font-size: 42px; font-weight: 900; color: var(--text); letter-spacing: -1px; line-height: 1; }
.stat-card:nth-child(1) .stat-card-value { color: var(--success); }
.stat-card:nth-child(2) .stat-card-value { color: var(--primary); }
.stat-card:nth-child(3) .stat-card-value { color: var(--warning); }
.stat-card:nth-child(4) .stat-card-value { color: #8B5CF6; }
.stat-card-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-top: 8px; }

.chart-section {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 22px 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.chart-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: var(--text); }
.chart-container { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 8px; }
.chart-bar-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
}
.chart-bar {
  width: 100%;
  max-width: 44px;
  background: linear-gradient(180deg, var(--primary), #63ADF2);
  border-radius: 6px 6px 0 0;
  min-height: 4px;
  transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.chart-bar-label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); margin-top: 8px; }
.chart-bar-value { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }

.stats-list {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.stats-list-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; color: var(--text); }
.stats-list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-light);
  font-size: 15px;
}
.stats-list-item:last-child { border-bottom: none; }
.stats-list-item .word-en { font-weight: 700; font-size: 16px; }
.stats-list-item .word-cn { color: var(--text-secondary); font-size: 14px; margin-left: 4px; }
.stats-list-item .word-pct { color: var(--danger); font-weight: 800; font-size: 15px; }

/* ===== Modals ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,15,25,0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 300;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-sheet {
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 840px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 28px 24px;
  padding-bottom: calc(28px + var(--safe-bottom));
  animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-title { font-size: 22px; font-weight: 800; margin-bottom: 24px; text-align: center; letter-spacing: -0.3px; }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 0.3px; }
.form-input {
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: 17px;
  font-weight: 500;
  transition: all 0.2s;
  min-height: 52px;
  background: var(--bg-subtle);
}
.form-input:focus { border-color: var(--primary); background: var(--bg); box-shadow: 0 0 0 4px rgba(59,125,216,0.08); }
.form-textarea {
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: 17px;
  font-weight: 500;
  min-height: 90px;
  resize: vertical;
  transition: all 0.2s;
  background: var(--bg-subtle);
}
.form-textarea:focus { border-color: var(--primary); background: var(--bg); box-shadow: 0 0 0 4px rgba(59,125,216,0.08); }
.translate-hint {
  font-size: 13px;
  color: var(--primary);
  padding: 4px 0 8px;
  font-weight: 500;
  min-height: 20px;
  transition: all 0.2s;
}

.modal-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn {
  flex: 1;
  padding: 16px 24px;
  border-radius: var(--radius-xs);
  font-weight: 700;
  font-size: 17px;
  text-align: center;
  min-height: 52px;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(59,125,216,0.3); }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,125,216,0.4); }
.btn-secondary { background: var(--bg-subtle); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border-light); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #C0392B; transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }

/* ===== Passage ===== */
.passage-card {
  background: var(--bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 28px 24px;
  margin-top: 20px;
  border: 1px solid var(--border-light);
}
.passage-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: var(--primary); text-align: center; letter-spacing: -0.3px; }
.passage-text { font-size: 16px; line-height: 1.9; margin-bottom: 24px; color: var(--text); }
.passage-text .pw { color: var(--primary); font-weight: 800; }
.passage-question { font-weight: 800; margin-bottom: 12px; font-size: 16px; color: var(--text); }
.passage-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.passage-option {
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius-xs);
  font-size: 16px;
  text-align: left;
  min-height: 48px;
  transition: all 0.2s;
  font-weight: 500;
  background: var(--bg);
}
.passage-option:hover { border-color: var(--primary); background: var(--primary-soft); }
.passage-option.chosen-correct { border-color: var(--success); background: var(--success-light); font-weight: 700; }
.passage-option.chosen-wrong { border-color: var(--danger); background: var(--danger-light); }

.import-export-row { display: flex; gap: 12px; margin-top: 12px; }

/* Session summary */
.session-summary { text-align: center; padding: 32px 20px; }
.session-summary .big-emoji { font-size: 80px; margin-bottom: 16px; }
.session-summary .summary-text { font-size: 18px; line-height: 1.8; color: var(--text); font-weight: 500; }
.session-summary .summary-stats { display: flex; gap: 16px; justify-content: center; margin-top: 20px; }
.session-summary .ss-stat {
  padding: 16px 24px;
  background: var(--bg-subtle);
  border-radius: var(--radius);
  text-align: center;
  border: 1px solid var(--border-light);
}
.session-summary .ss-stat-val { font-size: 32px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
.session-summary .ss-stat-lbl { font-size: 14px; color: var(--text-secondary); font-weight: 600; margin-top: 4px; }

/* Loading spinner */
.loading-spinner {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.syncing-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-tertiary);
  justify-content: center;
  padding: 4px;
}
.syncing-indicator .dot {
  width: 6px; height: 6px;
  background: var(--success);
  border-radius: 50%;
}

/* ===== Animations ===== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes bounce {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.06); }
  60% { transform: scale(0.97); }
  80% { transform: scale(1.02); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 50%, 90% { transform: translateX(-5px); }
  30%, 70% { transform: translateX(5px); }
}
@keyframes flashGreen {
  0% { background-color: var(--bg); border-color: var(--border-light); }
  25% { background-color: #EDF9F2; border-color: var(--success); }
  100% { background-color: var(--bg); border-color: var(--border-light); }
}
@keyframes flashRed {
  0% { background-color: var(--bg); border-color: var(--border-light); }
  25% { background-color: #FEF3F1; border-color: var(--danger); }
  100% { background-color: var(--bg); border-color: var(--border-light); }
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-12px) scale(0.9); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
@keyframes toastOut { from { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } to { opacity: 0; transform: translateX(-50%) translateY(-12px) scale(0.9); } }
@keyframes popIn {
  0% { transform: scale(0.85); opacity: 0; }
  70% { transform: scale(1.03); }
  100% { transform: scale(1); opacity: 1; }
}
.animate-bounce { animation: bounce 0.5s ease; }
.animate-pop { animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }

/* ===== Mobile First (phones < 480px) ===== */
@media (max-width: 479px) {
  html, body { font-size: 15px; }

  /* Header */
  #header { padding: 0 12px; height: 48px; }
  #header .logo { font-size: 16px; }

  .drag-word { font-size: 17px; padding: 12px 24px; }
  .drop-zone { padding: 12px 10px; font-size: 14px; }

  /* Word bank */

  .search-add-row { gap: 8px; margin-bottom: 10px; }
  .search-input { padding: 10px 14px; font-size: 14px; }

  .word-card-english { font-size: 16px; }

/* ===== Tablets & small desktops (480px - 767px) ===== */

  .quiz-prompt .word-display { font-size: 32px; }

}

@media (min-width: 768px) {
  .quiz-prompt { font-size: 26px; }
  .quiz-prompt .word-display { font-size: 38px; }

<body>

<!-- ===== Auth Screen ===== -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-icon">📖</div>
    <h1 class="auth-title">Vocabulary</h1>
    <p class="auth-desc">智能背单词 · 全平台同步</p>
    <div class="auth-tabs">
      <button class="auth-tab active" data-auth-tab="login">登 录</button>
      <button class="auth-tab" data-auth-tab="signup">注 册</button>
    </div>
    <div class="auth-form active" id="form-login">
      <div class="input-icon-wrap"><span class="input-icon">📧</span><input type="email" class="auth-input" id="login-email" placeholder="邮箱地址" autocomplete="email"></div>
      <div class="input-icon-wrap"><span class="input-icon">🔑</span><input type="password" class="auth-input" id="login-password" placeholder="密码" autocomplete="current-password"></div>
      <button type="button" class="auth-btn" id="btn-login" onclick="handleLogin()">登 录</button>
      <div class="auth-error" id="login-error"></div>
    </div>
    <div class="auth-form" id="form-signup">
      <div class="input-icon-wrap"><span class="input-icon">📧</span><input type="email" class="auth-input" id="signup-email" placeholder="邮箱地址" autocomplete="email"></div>
      <div class="input-icon-wrap"><span class="input-icon">🔑</span><input type="password" class="auth-input" id="signup-password" placeholder="设置密码（至少6位）" autocomplete="new-password"></div>
      <button type="button" class="auth-btn" id="btn-signup" onclick="handleSignup()">创建账号</button>
      <div class="auth-error" id="signup-error"></div>
    </div>
    <p class="auth-footer">🔒 加密传输 · 仅你可见 &nbsp;|&nbsp; <span id="js-status" style="color:#27AE60;">●</span> 系统就绪</p>
  </div>
</div>

<!-- ===== App Screen ===== -->
<div id="app-screen">
  <div id="app">
    <div id="header">
      <span class="logo">Vocabulary</span>
      <span class="streak-badge" id="streak-badge">🔥 0天</span>
      <div class="header-right">
        <button class="btn-install" id="btn-install" onclick="installPWA()" style="display:none;">⬇️ 安装</button>
        <span class="user-email" id="user-email-display"></span>
        <button class="btn-icon" id="btn-export" title="导入/导出">📦</button>
        <button class="btn-icon" id="btn-logout" title="退出登录">🚪</button>
      </div>
    </div>

    <div id="main-content">
      <!-- Study Panel -->
      <div class="panel active" id="panel-study">
        <div class="review-count" id="review-count">📋 今日待复习：计算中...</div>
        <div id="quiz-container"></div>
        <div id="passage-container"></div>
        <div id="session-end-container"></div>
      </div>

      <!-- Word Bank Panel -->
      <div class="panel" id="panel-wordbank">
        <div class="wordbank-tabs">
          <button class="wordbank-tab active" data-bank="new" id="wb-tab-new">🌱 生词库</button>
          <button class="wordbank-tab" data-bank="mastered" id="wb-tab-mastered">✅ 熟词库</button>
        </div>
        <div class="search-add-row">
          <input type="text" class="search-input" id="search-input" placeholder="🔍 搜索单词...">
          <button class="add-word-btn" id="btn-add-word">+ 添加</button>
        </div>
        <div class="dictation-bar" id="dictation-bar" style="display:none;">
          <span class="dictation-count" id="dictation-count">已选 0 个</span>
          <button class="dictation-btn" id="btn-select-all">全选</button>
          <button class="dictation-btn" id="btn-deselect-all">取消</button>
          <button class="dictation-btn primary" id="btn-start-dictation">🎧 开始听写</button>
        </div>
        <div class="word-list" id="word-list"></div>
        <div id="dictation-container"></div>
      </div>

      <!-- Stats Panel -->
      <div class="panel" id="panel-stats">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-card-value" id="stat-mastered">0</div><div class="stat-card-label">✅ 熟词库</div></div>
          <div class="stat-card"><div class="stat-card-value" id="stat-new">0</div><div class="stat-card-label">🌱 生词库</div></div>
          <div class="stat-card"><div class="stat-card-value" id="stat-today-studied">0</div><div class="stat-card-label">📝 今日学习</div></div>
          <div class="stat-card"><div class="stat-card-value" id="stat-today-mastered">0</div><div class="stat-card-label">🎯 今日掌握</div></div>
        </div>
        <div class="chart-section">
          <div class="chart-title">📊 最近7天学习量</div>
          <div class="chart-container" id="weekly-chart"></div>
        </div>
        <div class="stats-list"><div class="stats-list-title">🏆 最近掌握</div><div id="recent-mastered-list"></div></div>
        <div class="stats-list"><div class="stats-list-title">⚠️ 重点复习</div><div id="weakest-list"></div></div>
      </div>
    </div>

    <!-- Tab Bar -->
    <div id="tab-bar">
      <button class="tab active" data-panel="panel-study"><span class="tab-icon">📖</span><span>学习</span></button>
      <button class="tab" data-panel="panel-wordbank"><span class="tab-icon">📚</span><span>词库</span></button>
      <button class="tab" data-panel="panel-stats"><span class="tab-icon">📊</span><span>统计</span></button>
    </div>
  </div>
</div>

<!-- ===== Modals ===== -->
<div class="modal-overlay" id="modal-add-word" style="display:none;">
  <div class="modal-sheet">
    <div class="modal-title">✏️ 添加单词</div>
    <div class="form-group"><label class="form-label">英文</label><input type="text" class="form-input" id="add-english" placeholder="输入英文自动翻译中文" autocomplete="off"></div>
    <div class="translate-hint" id="translate-hint" style="display:none;"></div>
    <div class="form-group"><label class="form-label">中文释义</label><input type="text" class="form-input" id="add-chinese" placeholder="输入中文自动翻译英文" autocomplete="off"></div>
    <div class="form-group"><label class="form-label">词根词缀拆解（选填）</label><textarea class="form-textarea" id="add-breakdown" placeholder="例如：un否定 + happy快乐 → 不快乐的"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btn-add-cancel">取消</button>
      <button class="btn btn-primary" id="btn-add-confirm">✅ 添加到生词库</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-io" style="display:none;">
  <div class="modal-sheet">
    <div class="modal-title">📦 导入 / 导出</div>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;text-align:center;">数据已自动云端同步。<br>导出 JSON 可离线备份，或迁移到其他账号。</p>
    <div class="import-export-row">
      <button class="btn btn-primary" id="btn-do-export">📤 导出 JSON</button>
      <button class="btn btn-secondary" id="btn-do-import">📥 导入 JSON</button>
    </div>
    <input type="file" id="import-file-input" accept=".json" style="display:none;">
    <div class="modal-actions"><button class="btn btn-secondary" id="btn-io-close">关闭</button></div>
  </div>
</div>

<script src="./app.js?v=11"></script>
</body>
</html>
